<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Choppy Party</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0b0f1e; overflow: hidden; font-family: system-ui, sans-serif; }
      #gl, #game { position: absolute; inset: 0; margin: auto; display: block; }
      #gl { background: #000; }
      #game { pointer-events: none; }
      #bar {
        position: absolute; top: 10px; right: 10px; display: flex; gap: 8px; align-items: center;
        background: rgba(0,0,0,0.55); padding: 8px 10px; border-radius: 12px; color: #fff; font-size: 14px; z-index: 2;
      }
      #bar button, #bar input {
        font: inherit; border-radius: 8px; border: 1px solid #556; padding: 6px 10px; background: #1d2440; color: #fff;
      }
      #bar button { cursor: pointer; }
      #bar button:hover { background: #2c3766; }
      #bar input { width: 70px; text-transform: uppercase; letter-spacing: 2px; }
      #bar.hidden { display: none; }
      #joinBox {
        position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 4; background: #fff;
        color: #2a1b5e; border-radius: 24px; padding: 24px 28px; display: flex; flex-direction: column; gap: 14px;
        align-items: center; font-size: 20px; font-weight: 700; box-shadow: 0 10px 0 rgba(0,0,0,0.25); border: 5px solid #ffd23f;
      }
      #joinBox.hidden { display: none; }
      #joinBox input { font: inherit; font-size: 40px; width: 180px; text-align: center; letter-spacing: 8px; text-transform: uppercase;
        border: 3px solid #9a5bff; border-radius: 14px; padding: 6px; }
      #joinBox button { font: inherit; border: 0; border-radius: 12px; padding: 10px 20px; background: #2f8cff; color: #fff; cursor: pointer; }
      #joinBox #cancelJoin { background: #6b6f86; }
      #toast {
        position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%); background: #c0392b; color: #fff;
        padding: 8px 14px; border-radius: 10px; display: none; z-index: 3;
      }
    </style>
  </head>
  <body>
    <canvas id="gl"></canvas>
    <canvas id="game" width="1280" height="720"></canvas>
    <div id="bar" class="hidden">
      <span id="status">Local play</span>
      <button id="menuBtn">Main menu</button>
    </div>
    <div id="joinBox" class="hidden">
      <div>Enter the 4-letter room code</div>
      <input id="code" maxlength="4" placeholder="ABCD" aria-label="Room code" />
      <div><button id="joinBtn">Join</button> <button id="cancelJoin">Cancel</button></div>
    </div>
    <div id="toast"></div>
    <script type="module" src="/src/client/main.ts"></script>
  </body>
</html>
